name: Setup Parvaz Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract builder
        run: |
          set -e
          test -f Parvaz-GitHub-Builder.zip
          mkdir -p /tmp/parvaz
          unzip -q Parvaz-GitHub-Builder.zip -d /tmp/parvaz
          cp -a /tmp/parvaz/. .
          rm -f Parvaz-GitHub-Builder.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set up Parvaz builder" || exit 0
          git push
