name: Build Parvaz arm64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parvaz-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Parvaz builder
        uses: actions/checkout@v7
        with:
          path: builder
          fetch-depth: 0

      - name: Checkout latest v2rayNG
        uses: actions/checkout@v7
        with:
          repository: 2dust/v2rayNG
          ref: master
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            upstream/V2rayNG/**/*.gradle*
            upstream/V2rayNG/gradle/libs.versions.toml
            upstream/V2rayNG/gradle/wrapper/gradle-wrapper.properties

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            pillow==11.3.0

      - name: Apply original Parvaz customization
        shell: bash
        run: |
          set -euo pipefail

          python3 builder/scripts/customize.py upstream

      - name: Make default subscriptions removable
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "upstream/V2rayNG/app/src/main/java/"
              "com/v2ray/ang/AngApplication.kt"
          )

          text = path.read_text(encoding="utf-8")
          seed_key = "parvaz_subscriptions_seeded_v3"

          if seed_key in text:
              print("One-time subscription seeding is already enabled.")
              raise SystemExit(0)

          pattern = re.compile(
              r"(\n    private fun "
              r"(?:ensureParvazDefaults|"
              r"ensureParvazSubscriptions|"
              r"seedParvazSubscriptionsOnce)"
              r"\(\) \{\n)"
              r"(.*?)"
              r"(\n    \}\n)",
              re.DOTALL,
          )

          match = pattern.search(text)

          if match is None:
              raise RuntimeError(
                  "Default subscription method was not found "
                  "in AngApplication.kt"
              )

          opening = match.group(1)
          original_body = match.group(2)
          closing = match.group(3)

          guard = f'''        val seedKey = "{seed_key}"

                  if (
                      com.v2ray.ang.handler.MmkvManager
                          .decodeSettingsBool(
                              seedKey,
                              false
                          )
                  ) {{
                      return
                  }}

          '''

          save_flag = '''
                  com.v2ray.ang.handler.MmkvManager
                      .encodeSettings(
                          seedKey,
                          true
                      )
          '''

          replacement = (
              opening
              + guard
              + original_body.rstrip()
              + "\n\n"
              + save_flag.rstrip()
              + closing
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          if seed_key not in path.read_text(encoding="utf-8"):
              raise RuntimeError(
                  "One-time subscription patch validation failed"
              )

          print(
              "Default subscriptions will now be inserted only once."
          )
          PY

      - name: Build libhevtun
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          bash compile-hevtun.sh

          rm -rf V2rayNG/app/libs
          cp -r libs V2rayNG/app/

      - name: Download libv2ray
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG=$(
            git -C AndroidLibXrayLite \
              describe --tags --abbrev=0
          )

          echo "AndroidLibXrayLite tag: $CURRENT_TAG"

          mkdir -p V2rayNG/app/libs

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CURRENT_TAG}/libv2ray.aar"

          test -s V2rayNG/app/libs/libv2ray.aar

      - name: Build only arm64-v8a APK
        working-directory: upstream/V2rayNG
        shell: bash
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assemblePlaystoreDebug \
            -PABI_FILTERS=arm64-v8a

      - name: Collect only arm64-v8a APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          mapfile -t APKS < <(
            find \
              upstream/V2rayNG/app/build/outputs/apk/playstore/debug \
              -type f \
              -name '*arm64-v8a*.apk' \
              -print
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one arm64-v8a APK."
            echo "Found: ${#APKS[@]}"

            find \
              upstream/V2rayNG/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          cp \
            "${APKS[0]}" \
            "release/Parvaz-arm64-v8a.apk"

          sha256sum \
            release/Parvaz-arm64-v8a.apk \
            > release/SHA256SUMS.txt

          echo "Final APK:"
          ls -lh release/Parvaz-arm64-v8a.apk

      - name: Upload Parvaz arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: Parvaz-arm64-v8a
          path: |
            release/Parvaz-arm64-v8a.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
