name: Build Parvaz APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parvaz-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Parvaz builder
        uses: actions/checkout@v7
        with:
          path: builder
          fetch-depth: 0

      - name: Checkout latest v2rayNG
        uses: actions/checkout@v7
        with:
          repository: 2dust/v2rayNG
          ref: master
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            pillow==11.3.0

      - name: Apply Parvaz customization
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/customize.py upstream

      - name: Apply Parvaz dashboard UI
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/parvaz_ui_upgrade.py upstream

      - name: Build libhevtun
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          bash compile-hevtun.sh

          rm -rf V2rayNG/app/libs
          cp -r libs V2rayNG/app/

      - name: Download libv2ray
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)

          echo "AndroidLibXrayLite tag: $CURRENT_TAG"

          mkdir -p V2rayNG/app/libs

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CURRENT_TAG}/libv2ray.aar"

          test -s V2rayNG/app/libs/libv2ray.aar

      - name: Build installable Parvaz APK
        working-directory: upstream/V2rayNG
        shell: bash
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Collect generated APK files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          find upstream/V2rayNG/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print \
            -exec cp '{}' release/ \;

          APK_COUNT=$(find release -maxdepth 1 -type f -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APK was produced."
            exit 1
          fi

          sha256sum release/*.apk > release/SHA256SUMS.txt

          echo "Generated files:"
          ls -lh release

      - name: Upload Parvaz APK
        uses: actions/upload-artifact@v7
        with:
          name: Parvaz-APK-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
